<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tour 3D da casa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap">
<style>html,body{margin:0;background:#141516;height:100%;overflow:hidden}

/* Layout: palco 3D em tela cheia (IDV iCasas: casa em traço branco + três barras verde/azul/laranja); cabeçalho em cima, ambientes e controles embaixo */
:root{
  --bg:#111413; --panel:rgba(20,24,23,.88); --line:rgba(255,255,255,.10);
  --fg:#f3f5f4; --dim:#a3ada8;
  --verde:#57ac6e; --azul:#4ca8d8; --laranja:#ed8036; --ink:#0f1211;
  --r:12px;
  --f-display:'Nunito','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}
#app{position:relative;height:100%;width:100%}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;transition:opacity .3s}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.02em;
  color:var(--fg);background:rgba(17,20,19,.72);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap;backdrop-filter:blur(4px)}
.lbl.sel{background:var(--verde);color:var(--ink);border-color:var(--verde)}
/* prancha 2D do projeto (aparece ao clicar em Planta) */
#prancha{position:absolute;inset:0;background:transparent;opacity:0;pointer-events:none;transition:opacity .75s ease;overflow:hidden;touch-action:none}
#prancha.on{opacity:1;pointer-events:auto}
#prancha .papel{position:absolute;left:50%;top:50%;transform-origin:0 0;background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.45);will-change:transform}
#prancha img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
#prancha .tag{position:absolute;left:50%;transform:translateX(-50%);top:max(86px,calc(env(safe-area-inset-top,0px) + 78px));font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}

header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--bg) 30%,rgba(17,20,19,0));pointer-events:none}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand svg{width:44px;height:44px;flex-shrink:0}
.bars{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.bars i{display:block;width:4px;height:12px;border-radius:2px}
.bars i:nth-child(1){background:var(--verde)}.bars i:nth-child(2){background:var(--azul)}.bars i:nth-child(3){background:var(--laranja)}
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,4.4vw,28px);line-height:1.1;text-wrap:balance}
#info{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;backdrop-filter:blur(8px);max-width:200px}
#info .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#info .v{font-family:var(--f-display);font-size:19px;font-weight:800}

#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(17,20,19,0),var(--bg) 50%);pointer-events:none}
#chips{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding-top:22px}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.chip.on{background:var(--verde);border-color:var(--verde);color:var(--ink)}
#ctrls{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px}
button.b{font-family:var(--f-display);font-size:14px;font-weight:800;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;cursor:pointer}
.seg button.b{border:none;background:transparent;border-radius:9px;padding:7px 14px}
.seg button.b.on{background:var(--azul);color:var(--ink)}
button.b.tour{background:var(--laranja);border-color:var(--laranja);color:var(--ink)}
button.b.spin.on{border-color:var(--verde);color:var(--verde)}
button.b:focus-visible,.chip:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
#hint{font-size:12px;color:var(--dim)}
#caption{position:absolute;left:0;right:0;bottom:42%;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7vw,46px);
  color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .5s}
#caption.show{opacity:1}
#acts{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#acts .act{background:rgba(17,20,19,.82);backdrop-filter:blur(6px)}
#acts .act kbd{font-family:var(--f-display);font-size:11px;background:var(--azul);color:var(--ink);border-radius:6px;padding:1px 6px;margin-right:6px}
/* modo andar: some a interface do site e entra um HUD enxuto */
#app.walk header,#app.walk #bottom,#app.walk #acts{display:none!important}
#hud{position:absolute;inset:0;pointer-events:none}
#hud[hidden]{display:none!important}
.hb{pointer-events:auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;
  background:rgba(17,20,19,.62);color:#fff;border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);cursor:pointer}
.hb[hidden]{display:none!important}
.hb.on{background:var(--verde);border-color:var(--verde);color:var(--ink)}
.hb:focus-visible,#hDoor:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
#hExit{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px))}
#hRoom{position:absolute;top:max(20px,calc(env(safe-area-inset-top,0px) + 6px));left:50%;transform:translateX(-50%);pointer-events:none;
  font-family:var(--f-display);font-weight:800;font-size:14px;color:#fff;background:rgba(17,20,19,.62);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:7px 14px;white-space:nowrap;backdrop-filter:blur(8px)}
#hRoom:empty{display:none}
#hSide{position:absolute;bottom:max(130px,calc(env(safe-area-inset-bottom,0px) + 122px));right:max(14px,calc(env(safe-area-inset-right,0px) + 6px));display:flex;flex-direction:column;gap:10px}
#hDoor{pointer-events:auto;position:absolute;right:max(22px,calc(env(safe-area-inset-right,0px) + 14px));bottom:max(28px,calc(env(safe-area-inset-bottom,0px) + 18px));
  min-width:84px;height:84px;padding:0 18px;border-radius:42px;border:none;background:var(--laranja);color:var(--ink);font-family:var(--f-display);font-weight:800;
  font-size:13px;display:grid;place-items:center;align-content:center;gap:2px;box-shadow:0 4px 18px rgba(0,0,0,.35);cursor:pointer}
#hDoor b{font-size:22px;line-height:1}
#hDoor small{font-size:11px;font-weight:700;opacity:.8;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hDoor[hidden]{display:none!important}
#hMenu{position:absolute;right:max(72px,calc(env(safe-area-inset-right,0px) + 72px));bottom:max(130px,calc(env(safe-area-inset-bottom,0px) + 122px));pointer-events:auto;
  display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(17,20,19,.88);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px;
  backdrop-filter:blur(10px);max-height:calc(100% - 40px);overflow:auto}
#hMenu[hidden]{display:none!important}
#hMenu button{font-family:var(--f-display);font-weight:700;font-size:13px;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;white-space:nowrap}
#hMenu button.on{background:var(--verde);color:var(--ink);border-color:var(--verde)}
#hToast{position:absolute;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom,0px) + 18px));transform:translateX(-50%);max-width:min(560px,70%);text-align:center;
  font-size:12.5px;color:#fff;background:rgba(17,20,19,.7);border-radius:12px;padding:8px 12px;pointer-events:none;transition:opacity .6s}
#hToast.off{opacity:0}
#joy{position:absolute;left:max(18px,calc(env(safe-area-inset-left,0px) + 10px));bottom:max(22px,calc(env(safe-area-inset-bottom,0px) + 14px));width:104px;height:104px;border-radius:50%;background:rgba(17,20,19,.38);border:1px solid rgba(255,255,255,.2);touch-action:none;backdrop-filter:blur(4px);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.4)}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
#loading .box{display:grid;gap:12px;justify-items:center;font-family:var(--f-display);font-weight:700;color:var(--dim)}
#loading .bars i{height:26px;width:7px;animation:pulse 1s ease-in-out infinite}
#loading .bars i:nth-child(2){animation-delay:.15s}#loading .bars i:nth-child(3){animation-delay:.3s}
@keyframes pulse{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){#loading .bars i{animation:none}}
</style>
</head><body>

<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>
  <div id="prancha" aria-hidden="true"><div class="papel"><img alt="Planta baixa do projeto"></div><div class="tag">Planta do projeto · pinça ou scroll para zoom</div></div>
  <div id="caption"></div>
  <div id="fade"></div>
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 54V27L32 7l24 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="38" width="4" height="16" rx="2" fill="#57ac6e"/><rect x="31" y="38" width="4" height="16" rx="2" fill="#4ca8d8"/><rect x="38" y="38" width="4" height="16" rx="2" fill="#ed8036"/></svg>
      <div style="min-width:0">
        <div class="eyebrow"><span class="bars"><i></i><i></i><i></i></span>Vitrine dos Sonhos</div>
        <h1 id="tTitulo">Carregando…</h1>
      </div>
    </div>
    <div id="info" hidden aria-live="polite"><div class="k">Ambiente</div><div class="v" id="infoName">Sala</div></div>
  </header>
  <div id="bottom">
    <div id="chips" role="list"></div>
    <div id="ctrls">
      <div class="seg" role="group" aria-label="Visualização">
        <button class="b" id="b2d" type="button">Planta</button>
        <button class="b on" id="b3d" type="button">3D</button>
      </div>
      <button class="b tour" id="bTour" type="button">🚶 Andar pela casa</button>
      <button class="b spin" id="bSpin" type="button">⟳ Girar</button>
      <button class="b spin" id="bRoof" type="button" hidden>🏠 Telhado</button>
      <button class="b" id="bNight" type="button" hidden>🌙 Noite</button>
      <button class="b" id="bView" type="button" hidden>👁 1ª pessoa</button>
    </div>
    <div id="hint">Arraste para girar · pinça ou scroll para zoom · toque num ambiente · imagem ilustrativa</div>
  </div>
  <div id="acts" hidden><button class="b act" id="actDoor" type="button" hidden></button><button class="b act" id="actLight" type="button" hidden></button></div>
  <div id="hud" hidden>
    <button class="hb" id="hExit" type="button" aria-label="Sair da casa">✕</button>
    <div id="hRoom"></div>
    <div id="hSide">
      <button class="hb" id="hRooms" type="button" aria-label="Ir para um ambiente">🗺</button>
      <button class="hb" id="hLight" type="button" aria-label="Acender ou apagar a luz do ambiente">💡</button>
      <button class="hb" id="hNight" type="button" aria-label="Alternar dia e noite">🌙</button>
      <button class="hb" id="hView" type="button" aria-label="Alternar 1ª e 3ª pessoa" hidden>👁</button>
    </div>
    <div id="hMenu" hidden></div>
    <button id="hDoor" type="button" hidden><b>🚪</b><span>Abrir</span><small></small></button>
    <div id="hToast" class="off"></div>
  </div>
  <div id="joy" hidden aria-label="Controle de movimento"><div id="knob"></div></div>
  <div id="loading"><div class="box"><span class="bars"><i></i><i></i><i></i></span><span id="loadTxt">Carregando projeto…</span></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
window.__tour=function(CFG){
const BASE=CFG.base||'', CX=CFG.centro[0], CZ=CFG.centro[1], PD=CFG.pe_direito||2.8;
const W=(x,z)=>[x-CX,z-CZ];
document.getElementById('tTitulo').textContent=CFG.titulo; document.title=CFG.titulo+' · Tour 3D';
const loadTxt=document.getElementById('loadTxt');
if(!window.THREE||!THREE.GLTFLoader){loadTxt.textContent='Não foi possível carregar o visualizador 3D.';return;}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.78;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.localClippingEnabled=true;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
{ const c=document.createElement('canvas'); c.width=2; c.height=256; const g=c.getContext('2d'); const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#0c0f0e'); gr.addColorStop(.6,'#151918'); gr.addColorStop(1,'#1c2120'); g.fillStyle=gr; g.fillRect(0,0,2,256);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; scene.background=t; }
scene.fog=new THREE.Fog(0x151918,35,80); const FOG_NEAR=35, FOG_FAR=80;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new THREE.RoomEnvironment(),0.04).texture;

const camera=new THREE.PerspectiveCamera(40,1,0.1,1500);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.maxPolarAngle=Math.PI*0.48; controls.minDistance=2; controls.maxDistance=70; controls.autoRotateSpeed=0.7;

const hemi=new THREE.HemisphereLight(0xffffff,0x5a5249,0.55); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1dc,2.1);
const SH=2048;
sun.position.set(-12,15,10); sun.castShadow=true; sun.shadow.mapSize.set(SH,SH); sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.045;
Object.assign(sun.shadow.camera,{left:-15,right:15,top:15,bottom:-15,near:1,far:60}); scene.add(sun);

// Entorno: rua e calçada
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x1b1f1e,roughness:1,envMapIntensity:0.1}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.01; ground.receiveShadow=true; scene.add(ground);
const rua=new THREE.Mesh(new THREE.PlaneGeometry(60,7),new THREE.MeshStandardMaterial({color:0x222625,roughness:1,envMapIntensity:0.1}));
rua.rotation.x=-Math.PI/2; rua.position.set(0,0,(CFG.rua_z||CZ+12)-CZ); rua.receiveShadow=true; scene.add(rua);

// Texturas desenhadas no navegador (porcelanato, cimentado, grama, grafiato)
function canvasTex(w,h,draw,repU,repV){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repU,repV);
  t.encoding=THREE.sRGBEncoding; t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t;
}
function noise(g,w,h,amt,base){ const d=g.getImageData(0,0,w,h); for(let i=0;i<d.data.length;i+=4){const n=(Math.random()-.5)*amt; d.data[i]+=n; d.data[i+1]+=n; d.data[i+2]+=n;} g.putImageData(d,0,0); }
function wood(base,dark){ return (g,w,h)=>{ g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<90;i++){ const y=Math.random()*h, a=.05+Math.random()*.12; g.strokeStyle=dark; g.globalAlpha=a; g.lineWidth=1+Math.random()*3; g.beginPath();
    for(let x=0;x<=w;x+=16){ g.lineTo(x, y+Math.sin(x/70+i)*4+Math.sin(x/23+i*1.7)*1.5); } g.stroke(); }
  g.globalAlpha=1; noise(g,w,h,8); }; }
function tile(base,grout,amt,gw){ return (g,w,h)=>{ g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let k=0;k<6;k++){ g.fillStyle=`rgba(255,255,255,${.025+Math.random()*.03})`; g.beginPath(); g.ellipse(Math.random()*w,Math.random()*h,w*.5,h*.12,Math.random()*3,0,7); g.fill(); }
  noise(g,w,h,amt); g.fillStyle=grout; g.fillRect(0,0,w,gw); g.fillRect(0,0,gw,h); }; }
const TEX={
  piso:canvasTex(512,512,tile('#eeebe6','#d3cdc4',3,2),1/0.9,1/0.9),
  revest:canvasTex(256,512,tile('#e9e6e1','#d0cbc3',3,2),1/0.6,1/1.2),
  externo:canvasTex(256,256,tile('#dcd8d1','#c7c1b8',6,2),1,1),
  concreto:canvasTex(256,256,(g,w,h)=>{g.fillStyle='#d6d2cb';g.fillRect(0,0,w,h);noise(g,w,h,6);},1,1),
  fachada:canvasTex(256,256,(g,w,h)=>{g.fillStyle='#e2dfd9';g.fillRect(0,0,w,h);noise(g,w,h,5);},2,2),
  parede:canvasTex(256,256,(g,w,h)=>{g.fillStyle='#f3f1ec';g.fillRect(0,0,w,h);noise(g,w,h,3);},1,1),
  topo:canvasTex(128,128,(g,w,h)=>{g.fillStyle='#d9d5ce';g.fillRect(0,0,w,h);noise(g,w,h,4);},2,2),
  madeira:canvasTex(512,512,wood('#cdb08c','#b0916c'),1,1),
  porta:canvasTex(512,512,wood('#c4a47e','#a58561'),1,1),
  granito:canvasTex(256,256,(g,w,h)=>{g.fillStyle='#1c1c1d';g.fillRect(0,0,w,h);
    for(let i=0;i<2600;i++){const l=20+Math.random()*55;g.fillStyle=`rgb(${l},${l},${l+4})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2.5,1+Math.random()*2.5);} },2,2),
  grama:canvasTex(256,256,(g,w,h)=>{g.fillStyle='#9fb382';g.fillRect(0,0,w,h);
    for(let i=0;i<5000;i++){g.fillStyle=`hsl(${80+Math.random()*20},${18+Math.random()*12}%,${52+Math.random()*12}%)`;g.fillRect(Math.random()*w,Math.random()*h,1.5,3+Math.random()*3);} },0.7,0.7),
};
const CUT=['parede','fachada','revest','topo']; const cutMats=[]; let cutSide=null;
// quando duas peças ocupam o mesmo plano, a de número menor fica na frente (sem disputa = sem piscar)

function buildGrid(){
  const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),q=new THREE.Vector3();
  model.updateMatrixWorld(true);
  model.traverse(o=>{ if(!o.isMesh||SOLTO.includes(o.material.name)) return;
    const pos=o.geometry.attributes.position, idx=o.geometry.index, n=idx?idx.count:pos.count, mw=o.matrixWorld;

    if(!slug){ msg('Nenhuma casa informada.'); return; }
    const base='tours/'+slug+'/';
    try{ cfg=await (await fetch(base+'config.json',{cache:'no-cache'})).json(); }catch(e){ msg('Tour não encontrado.'); return; }
    cfg.base=base;
  }
  window.__tour(cfg);
})();
</script>
